package:
  name: q2-mystery-stew
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  host:
  - python  {{ python }}
  - setuptools
  - versioningit
  - wheel
  run:
  - python {{ python }}
  - qiime2 >={{ qiime2 }}
  build:
  - python {{ python }}
  - setuptools
  - versioningit
test:
  requires:
  - qiime2 >={{ qiime2 }}
  - pytest
  imports:
  - q2_mystery_stew
  commands:
  - py.test --pyargs q2_mystery_stew
about:
  home: https://qiime2.org
  license: BSD-3-Clause
  license_family: BSD
